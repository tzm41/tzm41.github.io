name: Daily News & Trends Briefing

on:
  # Scheduled GitHub Actions cron disabled in favor of Antigravity / local automation.
  # Uncomment below to re-enable daily cloud runs:
  # schedule:
  #   - cron: "30 12 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional override date (YYYY-MM-DD). Leave empty for today (UTC)."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  generate-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "scripts/briefing/requirements.txt"

      - name: Install pipeline dependencies
        run: pip install -r scripts/briefing/requirements.txt

      - name: Run daily briefing pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python -m scripts.briefing.run --date "${{ inputs.date }}"
          else
            python -m scripts.briefing.run
          fi

      - name: Commit updated briefing data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add briefing/data/
          if git diff --cached --quiet; then
            echo "No briefing data changes to commit."
            exit 0
          fi
          git commit -m "chore(briefing): update daily briefing data ($(date -u +%Y-%m-%d))"
          git push
