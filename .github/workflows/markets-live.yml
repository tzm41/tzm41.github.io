name: Pseudo-Live Market Tickers

on:
  schedule:
    # Every 30 minutes during US market hours (Mon-Fri, offset off :00/:30 to avoid GitHub cron drops)
    - cron: "17,47 13-21 * * 1-5"
    # Every 1 hour outside US market hours (weekday off-hours & weekends)
    - cron: "17 0-12,22-23 * * 1-5"
    - cron: "17 * * * 0,6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: markets-live
  cancel-in-progress: true

jobs:
  refresh-markets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "scripts/briefing/requirements.txt"

      - name: Install pipeline dependencies
        run: pip install -r scripts/briefing/requirements.txt

      - name: Fetch live market tickers
        run: python -m scripts.briefing.run --markets-only

      - name: Commit updated live market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add briefing/data/markets_live.json
          if git diff --cached --quiet; then
            echo "No live market changes to commit."
            exit 0
          fi
          git commit -m "chore(markets): refresh pseudo-live tickers"
          git pull --rebase origin master
          git push
