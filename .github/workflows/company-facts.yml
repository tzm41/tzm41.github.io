name: Refresh Company Facts

on:
  schedule:
    # Daily at 22:23 UTC (~2:23 PM PST / 3:23 PM PDT, shortly after US market close)
    - cron: "23 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: company-facts
  cancel-in-progress: true

jobs:
  refresh-company-facts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "scripts/briefing/requirements.txt"

      - name: Install pipeline dependencies
        run: pip install -r scripts/briefing/requirements.txt

      - name: Refresh public company market caps (batched + cascaded)
        run: python -m scripts.briefing.refresh_company_facts --mode active --batch-size 45

      - name: Commit updated company facts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/data/entities.json
          if git diff --cached --quiet; then
            echo "No company facts changes to commit."
            exit 0
          fi
          git commit -m "chore(briefing): refresh public company valuations ($(date -u +%Y-%m-%d))"
          git pull --rebase origin master
          git push
