<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tzm41 — Navigation</title>
  <meta name="description" content="Navigation hub for tzm41.github.io — Daily Briefing and personal homepage.">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf8f5">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1d2430">
  <link rel="icon" type="image/svg+xml" href="/briefing/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/briefing/favicon-32x32.png">
  <link rel="shortcut icon" href="/briefing/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/briefing/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #faf8f5;
      --surface: #ffffff;
      --surface-subtle: #f3f0ea;
      --border: #e4dfd6;
      --border-strong: #cfc8bc;

      --ink: #181a1f;
      --ink-secondary: #4a505c;
      --ink-muted: #6f7684;

      --accent: #a63a2b;
      --accent-soft: rgba(166, 58, 43, 0.09);

      --font-serif: "Newsreader", Georgia, "Times New Roman", serif;
      --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

      --radius: 8px;
      --radius-sm: 5px;
      --shadow-sm: 0 1px 2px rgba(24, 26, 31, 0.04);
      --shadow-md: 0 6px 20px rgba(24, 26, 31, 0.07);
    }

    [data-theme="dark"] {
      --bg: #161b24;
      --surface: #1d2430;
      --surface-subtle: #242d3c;
      --border: #303a4d;
      --border-strong: #435068;

      --ink: #eef0f4;
      --ink-secondary: #bcc4d2;
      --ink-muted: #8a95a8;

      --accent: #e06d53;
      --accent-soft: rgba(224, 109, 83, 0.14);

      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.22);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.34);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      background-color: var(--bg);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .topbar {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      font-family: var(--font-mono);
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--ink-muted);
    }

    .segmented {
      display: inline-flex;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 2px;
    }

    .seg-btn {
      border: 0;
      background: transparent;
      color: var(--ink-muted);
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
    }

    .seg-btn.active {
      background: var(--surface);
      color: var(--ink);
      box-shadow: var(--shadow-sm);
    }

    .center-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
    }

    .nav-card {
      width: 100%;
      max-width: 560px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 3px solid var(--accent);
      border-radius: var(--radius);
      padding: 32px 30px 28px;
      box-shadow: var(--shadow-md);
      text-align: center;
    }

    .kicker {
      display: block;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      margin-bottom: 6px;
    }

    h1 {
      margin: 0;
      font-family: var(--font-serif);
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .lead {
      margin: 12px auto 24px;
      max-width: 440px;
      font-size: 15px;
      color: var(--ink-secondary);
    }

    .primary-cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--accent);
      color: #ffffff;
      font-weight: 600;
      font-size: 14.5px;
      padding: 11px 22px;
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-sm);
      transition: opacity 0.15s ease, transform 0.15s ease;
    }

    .primary-cta:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .quick-links {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .quick-chip {
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--ink-secondary);
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 5px 11px;
      transition: border-color 0.15s ease, color 0.15s ease;
    }

    .quick-chip:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .bottom-bar {
      padding: 18px 20px 26px;
      display: flex;
      justify-content: center;
    }

    .legacy-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--ink-muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 6px 12px;
      transition: border-color 0.15s ease, color 0.15s ease;
    }

    .legacy-btn:hover {
      border-color: var(--border-strong);
      color: var(--ink);
    }

    @media (max-width: 540px) {
      .nav-card {
        padding: 26px 20px 22px;
      }

      h1 {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <span class="brand">tzm41.github.io</span>
    <div class="segmented" id="theme-switcher" role="group" aria-label="Color theme">
      <button type="button" class="seg-btn active" data-theme-pref="system" title="Follow system appearance">Auto</button>
      <button type="button" class="seg-btn" data-theme-pref="light" title="Light theme">Light</button>
      <button type="button" class="seg-btn" data-theme-pref="dark" title="Dark theme">Dark</button>
    </div>
  </header>

  <main class="center-stage">
    <section class="nav-card" aria-label="Primary navigation">
      <span class="kicker">Daily Intelligence</span>
      <h1>Daily Briefing</h1>
      <p class="lead">
        Top world news, stock markets &amp; Magnificent 7 trends, global conflict tracker, US politics pulse, and a daily bright spot.
      </p>
      <a class="primary-cta" href="/briefing/?date=latest">
        Open Daily Briefing &rarr;
      </a>
      <div class="quick-links" aria-label="Briefing sections">
        <a class="quick-chip" href="/briefing/?date=latest#executive">Overview</a>
        <a class="quick-chip" href="/briefing/?date=latest#news">Top News</a>
        <a class="quick-chip" href="/briefing/?date=latest#markets">Markets</a>
        <a class="quick-chip" href="/briefing/?date=latest#conflicts">Conflicts</a>
        <a class="quick-chip" href="/briefing/?date=latest#politics">US Politics</a>
        <a class="quick-chip" href="/briefing/?date=latest#positive">Positive News</a>
      </div>
    </section>
  </main>

  <footer class="bottom-bar">
    <a class="legacy-btn" href="./home.html">Original Homepage &rarr;</a>
  </footer>

  <script>
    (function () {
      const switcher = document.getElementById("theme-switcher");
      const media = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)");

      function resolveTheme(pref) {
        if (pref === "light" || pref === "dark") return pref;
        return media && media.matches ? "dark" : "light";
      }

      function apply(pref) {
        const valid = ["system", "light", "dark"].includes(pref) ? pref : "system";
        document.documentElement.setAttribute("data-theme", resolveTheme(valid));
        if (switcher) {
          switcher.querySelectorAll(".seg-btn").forEach((btn) => {
            const active = btn.dataset.themePref === valid;
            btn.classList.toggle("active", active);
            btn.setAttribute("aria-pressed", String(active));
          });
        }
      }

      apply(localStorage.getItem("briefing-theme") || "system");

      if (switcher) {
        switcher.addEventListener("click", (e) => {
          const btn = e.target.closest(".seg-btn");
          if (!btn) return;
          const next = btn.dataset.themePref || "system";
          localStorage.setItem("briefing-theme", next);
          apply(next);
        });
      }

      if (media && media.addEventListener) {
        media.addEventListener("change", () => {
          if ((localStorage.getItem("briefing-theme") || "system") === "system") {
            apply("system");
          }
        });
      }
    })();
  </script>
</body>
</html>
