</head>
<body class="bookmarks-page">
  <header class="masthead" id="top">
    <div class="container masthead-inner">
      <div class="masthead-brand">
        <div class="masthead-crumb-row">
          <a href="/" class="back-home" title="Back to main site">&larr; colintan.dev</a>
          <span class="crumb-sep" aria-hidden="true">&middot;</span>
          <a href="../briefing/?date=latest" class="back-home" title="Open Daily Briefing">Daily Briefing &rarr;</a>
          <span class="crumb-sep" aria-hidden="true">&middot;</span>
          <a href="../weekly/?date=latest" class="back-home" title="Open Weekly Briefing">Weekly Briefing &rarr;</a>
        </div>
        <div class="title-row">
          <h1>Bookmarks</h1>
          <span class="edition-label" id="bookmarks-count-label">0 saved</span>
        </div>
        <p class="masthead-sub">Daily retained 60 days &middot; Weekly retained 52 weeks</p>
      </div>

      <div class="masthead-controls">
        <button type="button" id="btn-tts-bookmarks" class="masthead-btn tts-btn tts-section-btn hidden" data-tts-section="bookmarks" data-tts-title="Saved Bookmarks" aria-label="Listen to saved bookmarks" aria-pressed="false" title="Listen to visible bookmarks">
          <span class="tts-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg></span>
          <span class="tts-btn-label">Listen</span>
        </button>

        <select id="bookmarks-sort" class="bm-sort-select" aria-label="Sort bookmarks">
          <option value="saved_desc">Newest Saved</option>
          <option value="date_desc">Edition Date</option>
          <option value="expiry_asc">Expiring Soonest</option>
        </select>

        <button type="button" id="btn-clear-expired" class="masthead-btn hidden" title="Remove expired archive bookmarks">
          Clear Expired
        </button>

        <button type="button" id="theme-toggle" class="masthead-icon-btn" aria-label="Toggle color theme" title="Toggle color theme"></button>

        <div id="auth-mount" class="auth-mount"></div>
      </div>
    </div>
  </header>

  <nav class="section-nav" aria-label="Filter bookmarks">
    <div class="container section-nav-inner">
      <div class="nav-links bm-filter-bar" id="bookmarks-filter-bar" role="tablist" aria-label="Bookmark type filter">
        <button type="button" class="bm-filter-tab active" data-filter="all" role="tab" aria-selected="true">
          <span>All</span><span class="bm-tab-count" data-count-for="all">0</span>
        </button>
      </div>
    </div>
  </nav>

  <main class="container main-content" id="app-root">
    <div id="expiry-banner" class="bm-expiry-banner hidden" role="status"></div>

    <div id="bookmarks-empty" class="bm-empty-state hidden"></div>

    <section id="available-section" class="section bm-section">
      <div class="news-grid" id="bookmarks-grid"></div>
      <div id="load-more-wrap" class="bm-load-more-wrap hidden">
        <button type="button" id="btn-load-more" class="masthead-btn">Load more bookmarks</button>
      </div>
    </section>

    <section id="expired-section" class="section bm-expired-section hidden">
      <div class="section-header">
        <div>
          <h2>Expired from Archive</h2>
        </div>
        <div class="section-actions">
          <span class="sub-note" id="expired-count-note"></span>
          <button type="button" id="btn-clear-expired-section" class="masthead-btn">Clear Expired</button>
        </div>
      </div>
      <div class="news-grid" id="expired-grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="bm-footer-sync is-signed-out" id="bookmarks-sync-indicator" role="status" aria-live="polite">
        <span class="bm-footer-sync-dot" aria-hidden="true"></span>
        <span class="bm-footer-sync-text">Not signed in &middot; Stored locally in this browser</span>
      </div>
      <a href="#top">Back to top &uarr;</a>
    </div>
  </footer>

  <script type="module" src="./app.js?v=9"></script>
</body>
</html>
